name: Treasury 0.8.26 audit proof
on:
  push:
    branches: [audit/treasury-6ac8-compiler-proof]
  workflow_dispatch:
jobs:
  foundry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audits/treasury-6ac8
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compiler and test execution
        run: |
          forge --version
          forge test --match-contract TreasuryReviewTest -vvv
      - name: Install engine analysis dependencies
        run: |
          python -m pip install -r ../../requirements.txt
          solc-select install 0.8.26
          solc-select use 0.8.26
      - name: Run original engine on complete corpus
        run: python engine_full_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treasury-engine-analysis
          path: audits/treasury-6ac8/engine-full-results.json
          if-no-files-found: ignore
